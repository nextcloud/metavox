# Triggered when /docs/ (or README) changes in this app repo.
# Fires a workflow_dispatch on voxcloud-platform/website deploy.yml, which
# rebuilds and redeploys voxcloud.nl/docs with the latest content.
#
# Sinds de Forgejo-migratie (23-08-2026) wijst dit naar forgejo.voxcloud.nl.
# Let op twee dingen die eerder stil misgingen:
#
#  1. Alleen het GitHub-stijl endpoint werkt
#     (/actions/workflows/<file>/dispatches). Het oudere repository_dispatch
#     (/dispatches) geeft 404, ook al declareert deploy.yml beide triggers.
#  2. De workflow heet nu .forgejo/workflows/deploy.yml, maar het endpoint
#     verwacht alleen de bestandsnaam — niet het pad.
name: Notify VoxCloud website on docs change

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deploy workflow
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{}}' \
            https://forgejo.voxcloud.nl/api/v1/repos/voxcloud-platform/website/actions/workflows/deploy.yml/dispatches
          echo "Dispatch sent for ${{ github.repository }}@${{ github.sha }}"
